name: Mission Control CI

on:
  push:
  pull_request:

jobs:
  lint:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: run linter
        uses: npm run lint