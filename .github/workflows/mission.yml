name: Mission Control CI

on:
  push:
  pull_request:

jobs:
  lint:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TP-mission-control-PLD
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: TP-mission-control-PLD/package-lock.json
      - name: install dependencies
        run: npm ci
      - name: run linter
        run: npm run lint
